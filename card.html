<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Résultats — Team Sandwich</title>
  <meta name="description" content="Résultats de recherche de cartes MTG">
  <link rel="icon" href="assets/icons/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/card.css">
</head>

<body>

<div class="app-container" id="appContainer">

  <aside class="sidebar collapsed" id="sidebar"></aside>

  <div class="menu-overlay" id="menuOverlay" onclick="toggleSidebarMobile()"></div>

  <div class="main-layout" id="mainLayout">

    <header class="header" id="header">
      <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleSidebarMobile()" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>

      <a href="index.html" class="logo-link-header">
        <img src="assets/images/IMG_6262.jpg" alt="Team Sandwich Logo" class="header-logo">
      </a>

      <div class="header-search-container">
        <div class="search-input-wrapper">
          <input type="text" id="headerSearchInput" class="search-input" data-i18n="searchPlaceholder" placeholder="Rechercher une carte, collection, numéro...">
          <button class="search-clear-btn" id="searchClearBtn" onclick="clearHeaderSearch()">&times;</button>
          <button class="search-btn" id="searchSubmitBtn" onclick="submitHeaderSearch()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
        </div>
        <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
      </div>

      <div class="header-spacer"></div>

      <div class="lang-selector">
        <select class="lang-selector-select" aria-label="Language">
          <option value="fr">FR</option>
          <option value="en">EN</option>
        </select>
      </div>

      <div class="user-actions" id="headerUserActions">
        <button class="btn-login-header" onclick="openLoginModal()" data-i18n="login">Connexion</button>
        <button class="btn-signup-header" onclick="openSignupModal()" data-i18n="signup">S'inscrire</button>
      </div>
    </header>

    <section class="search-info" id="searchInfo">
      <div class="search-info-header">
        <a href="index.html" class="back-btn" aria-label="Retour à l'accueil" title="Accueil">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </a>
        <div class="search-title-group">
          <h1 class="search-title" id="searchTitle">Recherche...</h1>
          <p class="search-subtitle" id="searchSubtitle"></p>
        </div>
      </div>
    </section>

    <section class="card-filters-bar" id="cardFiltersBar">
      
      <div class="filters-desktop">
        
        <div class="filter-dropdown" id="filterPrice">
          <button class="filter-dropdown-btn" onclick="toggleFilterDropdown('filterPrice')">
            <span data-i18n="sortByPrice">Trier par prix</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="filter-dropdown-menu">
            <button class="filter-option" data-value="price-asc" onclick="setFilterSort('price-asc')">
              <span data-i18n="priceLowToHigh">Moins cher → Plus cher</span>
            </button>
            <button class="filter-option" data-value="price-desc" onclick="setFilterSort('price-desc')">
              <span data-i18n="priceHighToLow">Plus cher → Moins cher</span>
            </button>
          </div>
        </div>

        <div class="filter-dropdown" id="filterRarity">
          <button class="filter-dropdown-btn" onclick="toggleFilterDropdown('filterRarity')">
            <span data-i18n="filterByRarity">Rarité</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="filter-dropdown-menu">
            <label class="filter-checkbox"><input type="checkbox" value="common" onchange="updateFilters()"><span data-i18n="rarityCommon">Common</span></label>
            <label class="filter-checkbox"><input type="checkbox" value="uncommon" onchange="updateFilters()"><span data-i18n="rarityUncommon">Uncommon</span></label>
            <label class="filter-checkbox"><input type="checkbox" value="rare" onchange="updateFilters()"><span data-i18n="rarityRare">Rare</span></label>
            <label class="filter-checkbox"><input type="checkbox" value="mythic" onchange="updateFilters()"><span data-i18n="rarityMythic">Mythic Rare</span></label>
          </div>
        </div>

        <div class="filter-dropdown" id="filterColor">
          <button class="filter-dropdown-btn" onclick="toggleFilterDropdown('filterColor')">
            <span data-i18n="filterByColor">Couleur</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="filter-dropdown-menu">
            <label class="filter-checkbox"><input type="checkbox" value="W" onchange="updateFilters()"><img src="https://svgs.scryfall.io/card-symbols/W.svg" alt="White" class="mana-symbol-icon"><span data-i18n="colorWhite">Blanc</span></label>
            <label class="filter-checkbox"><input type="checkbox" value="U" onchange="updateFilters()"><img src="https://svgs.scryfall.io/card-symbols/U.svg" alt="Blue" class="mana-symbol-icon"><span data-i18n="colorBlue">Bleu</span></label>
            <label class="filter-checkbox"><input type="checkbox" value="B" onchange="updateFilters()"><img src="https://svgs.scryfall.io/card-symbols/B.svg" alt="Black" class="mana-symbol-icon"><span data-i18n="colorBlack">Noir</span></label>
            <label class="filter-checkbox"><input type="checkbox" value="R" onchange="updateFilters()"><img src="https://svgs.scryfall.io/card-symbols/R.svg" alt="Red" class="mana-symbol-icon"><span data-i18n="colorRed">Rouge</span></label>
            <label class="filter-checkbox"><input type="checkbox" value="G" onchange="updateFilters()"><img src="https://svgs.scryfall.io/card-symbols/G.svg" alt="Green" class="mana-symbol-icon"><span data-i18n="colorGreen">Vert</span></label>
            <label class="filter-checkbox"><input type="checkbox" value="C" onchange="updateFilters()"><img src="https://svgs.scryfall.io/card-symbols/C.svg" alt="Colorless" class="mana-symbol-icon"><span data-i18n="colorColorless">Incolore</span></label>
            <label class="filter-checkbox"><input type="checkbox" value="M" onchange="updateFilters()"><img src="https://svgs.scryfall.io/card-symbols/WU.svg" alt="Multicolor" class="mana-symbol-icon"><span data-i18n="colorMulticolor">Multicolore</span></label>
          </div>
        </div>

        <div class="filter-dropdown" id="filterType">
          <button class="filter-dropdown-btn" onclick="toggleFilterDropdown('filterType')">
            <span data-i18n="filterByType">Type</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="filter-dropdown-menu">
            <label class="filter-checkbox"><input type="checkbox" value="Creature" onchange="updateFilters()"><span>Creature</span></label>
            <label class="filter-checkbox"><input type="checkbox" value="Instant" onchange="updateFilters()"><span>Instant</span></label>
            <label class="filter-checkbox"><input type="checkbox" value="Sorcery" onchange="updateFilters()"><span>Sorcery</span></label>
            <label class="filter-checkbox"><input type="checkbox" value="Artifact" onchange="updateFilters()"><span>Artifact</span></label>
            <label class="filter-checkbox"><input type="checkbox" value="Enchantment" onchange="updateFilters()"><span>Enchantment</span></label>
            <label class="filter-checkbox"><input type="checkbox" value="Planeswalker" onchange="updateFilters()"><span>Planeswalker</span></label>
            <label class="filter-checkbox"><input type="checkbox" value="Land" onchange="updateFilters()"><span>Land</span></label>
            <label class="filter-checkbox"><input type="checkbox" value="Battle" onchange="updateFilters()"><span>Battle</span></label>
          </div>
        </div>

        <button class="filter-clear-btn" id="filterClearBtn" onclick="clearAllFilters()" style="display:none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          <span data-i18n="clearFilters">Effacer les filtres</span>
        </button>
      </div>

      <button class="filters-mobile-btn" id="filtersMobileBtn" onclick="openFilterDrawer()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
        <span data-i18n="filters">Filtres</span>
        <span class="filter-badge" id="filterBadge" style="display:none;">0</span>
      </button>

      <div class="layout-toggles">
        <button class="layout-toggle-btn active" data-layout="auto" onclick="setGridLayout('auto')" title="Auto">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="0" y="0" width="4.5" height="4.5" rx="1"/><rect x="5.75" y="0" width="4.5" height="4.5" rx="1"/><rect x="11.5" y="0" width="4.5" height="4.5" rx="1"/><rect x="0" y="5.75" width="4.5" height="4.5" rx="1"/><rect x="5.75" y="5.75" width="4.5" height="4.5" rx="1"/><rect x="11.5" y="5.75" width="4.5" height="4.5" rx="1"/><rect x="0" y="11.5" width="4.5" height="4.5" rx="1"/><rect x="5.75" y="11.5" width="4.5" height="4.5" rx="1"/><rect x="11.5" y="11.5" width="4.5" height="4.5" rx="1"/></svg>
        </button>
        <button class="layout-toggle-btn" data-layout="grid-2" onclick="setGridLayout('grid-2')" title="2 colonnes">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="0" y="0" width="7" height="7" rx="1"/><rect x="9" y="0" width="7" height="7" rx="1"/><rect x="0" y="9" width="7" height="7" rx="1"/><rect x="9" y="9" width="7" height="7" rx="1"/></svg>
        </button>
        <button class="layout-toggle-btn" data-layout="grid-list" onclick="setGridLayout('grid-list')" title="Liste">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="0" y="0" width="16" height="3" rx="1"/><rect x="0" y="4.33" width="16" height="3" rx="1"/><rect x="0" y="8.66" width="16" height="3" rx="1"/><rect x="0" y="13" width="16" height="3" rx="1"/></svg>
        </button>
      </div>
    </section>

    <div class="active-filters-strip" id="activeFiltersStrip" style="display:none;">
      <span class="active-filters-text" id="activeFiltersText"></span>
      <button class="active-filters-clear" onclick="clearAllFilters()">✕</button>
    </div>

    <section class="pagination-bar" id="paginationBar">
      <div class="per-page-selector">
        <label for="perPageSelect" data-i18n="cardsPerPage">Cartes par page :</label>
        <select id="perPageSelect" onchange="changePerPage(this.value)">
          <option value="15" selected>15</option>
          <option value="30">30</option>
          <option value="45">45</option>
          <option value="60">60</option>
          <option value="75">75</option>
          <option value="all">Toutes</option>
        </select>
      </div>
      <div class="page-nav" id="pageNav"></div>
    </section>

    <section class="results-section">
      <div id="resultado" class="grid"></div>
    </section>

    <section class="pagination-bar pagination-bottom" id="paginationBarBottom">
      <div class="page-nav" id="pageNavBottom"></div>
    </section>
  </div>
</div>

<div class="filter-drawer-overlay" id="filterDrawerOverlay" onclick="closeFilterDrawer()"></div>
<div class="filter-drawer" id="filterDrawer">
  <div class="filter-drawer-header">
    <h3 data-i18n="filters">Filtres</h3>
    <button class="filter-drawer-close" onclick="closeFilterDrawer()">&times;</button>
  </div>
  <div class="filter-drawer-body">
    
    <div class="filter-drawer-section">
      <h4 data-i18n="sortByPrice">Trier par prix</h4>
      <div class="filter-drawer-options">
        <button class="filter-drawer-chip" data-value="price-asc" onclick="setFilterSort('price-asc')">
          <span data-i18n="priceLowToHigh">Moins cher → Plus cher</span>
        </button>
        <button class="filter-drawer-chip" data-value="price-desc" onclick="setFilterSort('price-desc')">
          <span data-i18n="priceHighToLow">Plus cher → Moins cher</span>
        </button>
      </div>
    </div>
    
    <div class="filter-drawer-section">
      <h4 data-i18n="filterByRarity">Rarité</h4>
      <div class="filter-drawer-options">
        <label class="filter-checkbox"><input type="checkbox" value="common" onchange="updateFilters()"><span data-i18n="rarityCommon">Common</span></label>
        <label class="filter-checkbox"><input type="checkbox" value="uncommon" onchange="updateFilters()"><span data-i18n="rarityUncommon">Uncommon</span></label>
        <label class="filter-checkbox"><input type="checkbox" value="rare" onchange="updateFilters()"><span data-i18n="rarityRare">Rare</span></label>
        <label class="filter-checkbox"><input type="checkbox" value="mythic" onchange="updateFilters()"><span data-i18n="rarityMythic">Mythic Rare</span></label>
      </div>
    </div>
    
    <div class="filter-drawer-section">
      <h4 data-i18n="filterByColor">Couleur</h4>
      <div class="filter-drawer-options">
        <label class="filter-checkbox"><input type="checkbox" value="W" onchange="updateFilters()"><img src="https://svgs.scryfall.io/card-symbols/W.svg" alt="White" class="mana-symbol-icon"><span data-i18n="colorWhite">Blanc</span></label>
        <label class="filter-checkbox"><input type="checkbox" value="U" onchange="updateFilters()"><img src="https://svgs.scryfall.io/card-symbols/U.svg" alt="Blue" class="mana-symbol-icon"><span data-i18n="colorBlue">Bleu</span></label>
        <label class="filter-checkbox"><input type="checkbox" value="B" onchange="updateFilters()"><img src="https://svgs.scryfall.io/card-symbols/B.svg" alt="Black" class="mana-symbol-icon"><span data-i18n="colorBlack">Noir</span></label>
        <label class="filter-checkbox"><input type="checkbox" value="R" onchange="updateFilters()"><img src="https://svgs.scryfall.io/card-symbols/R.svg" alt="Red" class="mana-symbol-icon"><span data-i18n="colorRed">Rouge</span></label>
        <label class="filter-checkbox"><input type="checkbox" value="G" onchange="updateFilters()"><img src="https://svgs.scryfall.io/card-symbols/G.svg" alt="Green" class="mana-symbol-icon"><span data-i18n="colorGreen">Vert</span></label>
        <label class="filter-checkbox"><input type="checkbox" value="C" onchange="updateFilters()"><img src="https://svgs.scryfall.io/card-symbols/C.svg" alt="Colorless" class="mana-symbol-icon"><span data-i18n="colorColorless">Incolore</span></label>
        <label class="filter-checkbox"><input type="checkbox" value="M" onchange="updateFilters()"><img src="https://svgs.scryfall.io/card-symbols/WU.svg" alt="Multicolor" class="mana-symbol-icon"><span data-i18n="colorMulticolor">Multicolore</span></label>
      </div>
    </div>
    
    <div class="filter-drawer-section">
      <h4 data-i18n="filterByType">Type</h4>
      <div class="filter-drawer-options">
        <label class="filter-checkbox"><input type="checkbox" value="Creature" onchange="updateFilters()"><span>Creature</span></label>
        <label class="filter-checkbox"><input type="checkbox" value="Instant" onchange="updateFilters()"><span>Instant</span></label>
        <label class="filter-checkbox"><input type="checkbox" value="Sorcery" onchange="updateFilters()"><span>Sorcery</span></label>
        <label class="filter-checkbox"><input type="checkbox" value="Artifact" onchange="updateFilters()"><span>Artifact</span></label>
        <label class="filter-checkbox"><input type="checkbox" value="Enchantment" onchange="updateFilters()"><span>Enchantment</span></label>
        <label class="filter-checkbox"><input type="checkbox" value="Planeswalker" onchange="updateFilters()"><span>Planeswalker</span></label>
        <label class="filter-checkbox"><input type="checkbox" value="Land" onchange="updateFilters()"><span>Land</span></label>
        <label class="filter-checkbox"><input type="checkbox" value="Battle" onchange="updateFilters()"><span>Battle</span></label>
      </div>
    </div>
  </div>
  <div class="filter-drawer-footer">
    <button class="btn-secondary" onclick="clearAllFilters()" data-i18n="clearFilters">Effacer les filtres</button>
    <button class="btn-primary" onclick="closeFilterDrawer()">OK</button>
  </div>
</div>

<div class="collections-modal-overlay" id="collectionsModalOverlay" onclick="closeCollectionsModal()"></div>
<div class="collections-modal" id="collectionsModal">
  <div class="collections-modal-header">
    <h2 data-i18n="allCollections">Toutes les Collections</h2>
    <button class="modal-close-btn" onclick="closeCollectionsModal()">&times;</button>
  </div>
  <div class="collections-modal-toolbar">
    <div class="collections-search-wrapper">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="collectionsSearchInput" class="collections-search-input" data-i18n="searchCollections" placeholder="Rechercher une collection...">
    </div>
    <div class="collections-sort-group">
      <button class="collections-sort-btn active" data-sort="newest" onclick="setCollectionsSort('newest')" data-i18n="sortNewest">Plus récentes</button>
      <button class="collections-sort-btn" data-sort="oldest" onclick="setCollectionsSort('oldest')" data-i18n="sortOldest">Plus anciennes</button>
      <button class="collections-sort-btn" data-sort="az" onclick="setCollectionsSort('az')" data-i18n="sortAZ">A → Z</button>
      <button class="collections-sort-btn" data-sort="za" onclick="setCollectionsSort('za')" data-i18n="sortZA">Z → A</button>
    </div>
  </div>
  <div class="collections-modal-body">
    <div class="collections-grid" id="collectionsGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="authModalOverlay" onclick="closeAuthModals()"></div>
<div class="auth-modal" id="loginModal">
  <button class="modal-close-btn" onclick="closeAuthModals()">&times;</button>
  <h2 data-i18n="modalLoginTitle">Connexion à votre compte</h2>
  <form id="loginForm" onsubmit="handleLoginSubmit(event)">
    <div class="input-group"><input type="email" id="loginEmail" required data-i18n="emailPlaceholder" placeholder="Adresse e-mail"></div>
    <div class="input-group"><input type="password" id="loginPassword" required data-i18n="passwordPlaceholder" placeholder="Mot de passe"></div>
    <button type="submit" class="btn-primary auth-submit-btn" data-i18n="modalLoginBtn">Se connecter</button>
  </form>
  <p class="auth-switch" onclick="switchToSignup(event)"><a href="#" data-i18n="dontHaveAccount">Pas encore de compte ? S'inscrire</a></p>
</div>
<div class="auth-modal" id="signupModal">
  <button class="modal-close-btn" onclick="closeAuthModals()">&times;</button>
  <h2 data-i18n="modalSignupTitle">Créer un compte</h2>
  <form id="signupForm" onsubmit="handleSignupSubmit(event)">
    <div class="input-group"><input type="text" id="signupUsername" required data-i18n="usernamePlaceholder" placeholder="Nom d'utilisateur"></div>
    <div class="input-group"><input type="email" id="signupEmail" required data-i18n="emailPlaceholder" placeholder="Adresse e-mail"></div>
    <div class="input-group"><input type="password" id="signupPassword" required data-i18n="passwordPlaceholder" placeholder="Mot de passe"></div>
    <button type="submit" class="btn-primary auth-submit-btn" data-i18n="modalSignupBtn">S'inscrire</button>
  </form>
  <p class="auth-switch" onclick="switchToLogin(event)"><a href="#" data-i18n="alreadyHaveAccount">Vous avez déjà un compte ? Se connecter</a></p>
</div>

<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="js/card.js"></script>

</body>
</html>
